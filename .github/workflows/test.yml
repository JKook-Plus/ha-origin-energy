name: Test

on:
  push:
  pull_request:
  schedule:
    # Daily, alongside Validate: the suite runs against the latest Home
    # Assistant, so a breaking core release shows up here before a user
    # reports it.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest
